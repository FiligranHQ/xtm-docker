# Example Docker Runtime Configuration for OpenSandbox Server
#
# Full configuration reference: https://github.com/alibaba/OpenSandbox/blob/main/server/configuration.md

[server]
host = "0.0.0.0"
port = 8090
# api_key is set via environment variables so the same
# config file works for both local runs and containerised deployments:
#   OPENSANDBOX_SERVER_API_KEY – API key sent by clients in the request header.
# Server defaults when the variables are absent: host=0.0.0.0, port=8080,
# api_key=null (authentication disabled; set a non-empty key for production).
max_sandbox_timeout_seconds = 86400

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "docker.io/opensandbox/execd:v1.0.20"

[storage]
# Allowlist of host path prefixes permitted for bind mounts.
# If empty, all host paths are allowed (not recommended for production).
# Example: allowed_host_paths = ["/data/opensandbox", "/tmp/sandbox"]
allowed_host_paths = []

# Default storage size for auto-created Kubernetes PVCs (when caller omits size).
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "~/.opensandbox/opensandbox.db"

[docker]
network_mode = "bridge"
# host_ip tells the server how to reach host-mapped ports (e.g. the egress
# sidecar's /healthz) when the server itself runs inside a Docker container.
# Without this, _resolve_proxy_host() falls back to 127.0.0.1, which is the
# container's own loopback and cannot reach host-mapped sidecar ports.
host_ip = "host.docker.internal"
# Drop dangerous capabilities and block privilege escalation
# drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
drop_capabilities = ["ALL"]
no_new_privileges = true
# Optional: set an AppArmor profile name (e.g., "docker-default") when AppArmor is enabled
apparmor_profile = ""
# Limit process count to reduce host impact from fork bombs; set to null to disable
# pids_limit = 4096
# 50 upstream; OpenBLAS (numpy, imported by the code-interpreter wrapper) starts one
# thread per visible CPU and pids_limit counts threads, so on a host with many cores
# (64 on the lab VM) every Python sandbox fails at import. 256 keeps fork-bomb protection.
pids_limit = 256
# Seccomp profile: empty string uses Docker default; set to an absolute path for a custom profile
seccomp_profile = ""

[ingress]
mode = "direct"

[egress]
image = "docker.io/opensandbox/egress:v1.1.0"
# dns+nft adds nftables IP-level enforcement on top of DNS interception.
# With dns-only, code that connects via a hardcoded IP bypasses the policy.
mode = "dns+nft"

# 🧪 [EXPERIMENTAL] Renew-on-access. Off by default — see server/README.md.
[renew_intent]
enabled = false
min_interval_seconds = 60

