# Settings XTM One's platform and workers both read (see XTM One's docker-compose.yml)
x-xtm-one-environment: &xtm-one-environment
  PLATFORM_MODE: xtm_one
  PLATFORM_REGISTRATION_TOKEN: ${PLATFORM_REGISTRATION_TOKEN}
  # The workers build absolute links and sign the tokens of background work too
  BASE_URL: ${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
  FRONTEND_URL: ${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
  BASE_PATH: ${XTM_ONE_BASE_PATH:-}
  ADMIN_EMAIL: ${XTM_ONE_ADMIN_EMAIL}
  ADMIN_PASSWORD: ${XTM_ONE_ADMIN_PASSWORD}
  SECRET_KEY: ${XTM_ONE_SECRET_KEY}
  DATABASE_URL: postgresql+asyncpg://${XTM_ONE_POSTGRES_USER}:${XTM_ONE_POSTGRES_PASSWORD}@pgsql:5432/xtm_one
  REDIS_MODE: sentinel
  REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  REDIS_SENTINEL_SERVICE: ${REDIS_SENTINEL_MASTER_NAME:-xtm-master}
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${XTM_ONE_S3_BUCKET:-xtm-one-files}
  S3_USE_SSL: "false"
  LOG_LEVEL: ${XTM_ONE_LOG_LEVEL:-info}
  LOG_FORMAT: ${XTM_ONE_LOG_FORMAT:-json}
  ENTERPRISE_LICENSE: ${XTM_ONE_ENTERPRISE_LICENSE:-}
  # Feature flags, empty by default (e.g. VIDEO_STUDIO)
  ENABLED_FEATURES: ${XTM_ONE_ENABLED_FEATURES:-}
  RUNNERS_ENABLED: ${XTM_ONE_RUNNERS_ENABLED:-true}
  RELAYS_ENABLED: ${XTM_ONE_RELAYS_ENABLED:-true}
  # Internal API endpoints for platform integrations (Docker hostnames)
  OPENCTI_API_URL: http://opencti:8080
  OPENAEV_API_URL: http://openaev:8080
  # Custom tool and code interpreter isolation: opensandbox (the opensandbox service)
  # | docker | subprocess | auto
  CUSTOM_TOOL_SANDBOX: ${XTM_ONE_CUSTOM_TOOL_SANDBOX:-opensandbox}
  OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:-opensandbox:8090}
  OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:-http}
  OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
  # XTM One's defaults (sandbox-python:0.3, sandbox-nodejs:0.3) name locally built
  # images: use the published ones
  OPENSANDBOX_IMAGES: ${OPENSANDBOX_IMAGES:-python:docker.io/xtmone/sandbox-python:0.3,nodejs:docker.io/xtmone/sandbox-nodejs:0.3}
  # Egress allowed from the sandboxes (domains/IPs, comma-separated); empty = none
  OPENSANDBOX_NETWORK_ALLOW: ${OPENSANDBOX_NETWORK_ALLOW:-}
  # Self-hosted: no usage-based sandbox billing
  DISABLE_SANDBOX_QUOTA_USAGE: ${DISABLE_SANDBOX_QUOTA_USAGE:-true}

# OpenCTI settings shared by the front and ingest nodes (same image, same backends;
# the role comes from routing and from which managers each node runs)
x-opencti-environment: &opencti-environment
  NODE_OPTIONS: '--max-old-space-size=8096'
  APP__PORT: '8080'
  APP__BASE_URL: '${OPENCTI_EXTERNAL_SCHEME}://${OPENCTI_HOST}:${OPENCTI_PORT}'
  APP__ADMIN__EMAIL: '${OPENCTI_ADMIN_EMAIL}'
  APP__ADMIN__PASSWORD: '${OPENCTI_ADMIN_PASSWORD}'
  APP__ADMIN__TOKEN: '${OPENCTI_ADMIN_TOKEN}'
  APP__ENCRYPTION_KEY: '${OPENCTI_ENCRYPTION_KEY}'
  APP__APP_LOGS__LOGS_LEVEL: 'error'
  REDIS__MODE: 'sentinel'
  REDIS__HOSTNAMES: '["redis-sentinel-1:26379","redis-sentinel-2:26379","redis-sentinel-3:26379"]'
  REDIS__SENTINEL_MASTER_NAME: '${REDIS_SENTINEL_MASTER_NAME:-xtm-master}'
  REDIS__SENTINEL_FAILOVER_DETECTOR: 'true'
  ELASTICSEARCH__URL: '["http://es01:9200","http://es02:9200","http://es03:9200"]'
  ELASTICSEARCH__NUMBER_OF_REPLICAS: '1'
  MINIO__ENDPOINT: 'minio'
  MINIO__PORT: '9000'
  MINIO__USE_SSL: 'false'
  MINIO__ACCESS_KEY: '${MINIO_ROOT_USER}'
  MINIO__SECRET_KEY: '${MINIO_ROOT_PASSWORD}'
  RABBITMQ__HOSTNAME: 'rabbitmq'
  RABBITMQ__PORT: '5672'
  RABBITMQ__PORT_MANAGEMENT: '15672'
  RABBITMQ__MANAGEMENT_SSL: 'false'
  RABBITMQ__USERNAME: '${RABBITMQ_DEFAULT_USER}'
  RABBITMQ__PASSWORD: '${RABBITMQ_DEFAULT_PASS}'
  SMTP__HOSTNAME: '${SMTP_HOST}'
  SMTP__PORT: '25'
  PROVIDERS__LOCAL__STRATEGY: 'LocalStrategy'
  APP__HEALTH_ACCESS_KEY: '${OPENCTI_HEALTHCHECK_ACCESS_KEY}'
  XTM__OPENAEV_URL: '${OPENAEV_EXTERNAL_SCHEME}://${OPENAEV_HOST}:${OPENAEV_PORT}'
  XTM__OPENAEV_API_URL: 'http://openaev:8080'
  XTM__OPENAEV_TOKEN: '${OPENAEV_ADMIN_TOKEN}'
  XTM__XTM_ONE_URL: 'http://xtm-one:4000'
  XTM__XTM_ONE_TOKEN: '${PLATFORM_REGISTRATION_TOKEN}'

services:

  ###########################
  # DEPENDENCIES            #
  ###########################

  # Generate RSA key for xtm-composer (PKCS#8 format)
  rsa-key-generator:
    image: alpine/openssl:latest
    volumes:
      - rsakeys:/keys
    entrypoint: ["/bin/ash"]
    command: ["-c", "if [ ! -f /keys/private_key.pem ]; then openssl genpkey -algorithm RSA -out /keys/private_key.pem -pkeyopt rsa_keygen_bits:4096; fi && tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "test", "-f", "/keys/private_key.pem"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
  # Redis in Sentinel mode: one primary, two replicas, three sentinels (quorum 2).
  # Clients (OpenCTI, XTM One) discover the current master through the sentinels.
  # Nodes announce their hostnames so the sentinels hand clients resolvable names.
  redis-primary:
    image: redis:8.8.0
    hostname: redis-primary
    restart: always
    command: ["redis-server", "--replica-announce-ip", "redis-primary"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata-primary:/data
    healthcheck: &redis-node-healthcheck
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  redis-replica-1:
    image: redis:8.8.0
    hostname: redis-replica-1
    restart: always
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--replica-announce-ip", "redis-replica-1"]
    volumes:
      - redisdata-replica-1:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck: *redis-node-healthcheck
  redis-replica-2:
    image: redis:8.8.0
    hostname: redis-replica-2
    restart: always
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--replica-announce-ip", "redis-replica-2"]
    volumes:
      - redisdata-replica-2:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck: *redis-node-healthcheck
  # Sentinel rewrites its config after a failover: keep it on a volume so a restart
  # does not forget which node is master. Written once, on the first start only.
  redis-sentinel-1: &redis-sentinel
    image: redis:8.8.0
    hostname: redis-sentinel-1
    restart: always
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f /data/sentinel.conf ]; then
        cat >/data/sentinel.conf <<EOF
        port 26379
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel announce-ip $$(hostname)
        sentinel monitor $${REDIS_SENTINEL_MASTER_NAME} redis-primary 6379 2
        sentinel down-after-milliseconds $${REDIS_SENTINEL_MASTER_NAME} 5000
        sentinel failover-timeout $${REDIS_SENTINEL_MASTER_NAME} 10000
        sentinel parallel-syncs $${REDIS_SENTINEL_MASTER_NAME} 1
        EOF
        fi
        exec redis-sentinel /data/sentinel.conf
    environment:
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-xtm-master}
    volumes:
      - redis-sentinel-1:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  redis-sentinel-2:
    <<: *redis-sentinel
    hostname: redis-sentinel-2
    volumes:
      - redis-sentinel-2:/data
  redis-sentinel-3:
    <<: *redis-sentinel
    hostname: redis-sentinel-3
    volumes:
      - redis-sentinel-3:/data
  # Elasticsearch: three nodes, each master-eligible and data (the default roles).
  # cluster.initial_master_nodes only matters for the very first bootstrap.
  es01: &elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.18
    hostname: es01
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    environment: &elasticsearch-environment
      node.name: es01
      cluster.name: ${ELASTIC_CLUSTER_NAME:-xtm-cluster}
      discovery.seed_hosts: es01,es02,es03
      cluster.initial_master_nodes: es01,es02,es03
      xpack.ml.enabled: "false"
      xpack.security.enabled: "false"
      thread_pool.search.queue_size: "5000"
      logger.org.elasticsearch.discovery: "ERROR"
      ES_JAVA_OPTS: "-Xms${ELASTIC_MEMORY_SIZE} -Xmx${ELASTIC_MEMORY_SIZE}"
    ports:
      - "9200:9200"
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 50
  es02:
    <<: *elasticsearch
    hostname: es02
    volumes:
      - esdata02:/usr/share/elasticsearch/data
    environment:
      <<: *elasticsearch-environment
      node.name: es02
    ports: []
  es03:
    <<: *elasticsearch
    hostname: es03
    volumes:
      - esdata03:/usr/share/elasticsearch/data
    environment:
      <<: *elasticsearch-environment
      node.name: es03
    ports: []
  pgsql:
    # Shared by OpenAEV (openaev database) and XTM One (xtm_one database, created by
    # xtm-one-db-init). XTM One needs the pgvector extension.
    image: pgvector/pgvector:pg17
    # OpenAEV (up to 20 connections) and XTM One (up to 35 per process, tracing pool
    # included, over 2 web workers and its 3 workers) exceed the default of 100
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openaev
    volumes:
      - pgsqlshareddata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      # Over TCP: on the first start, the temporary server that initialises the volume
      # listens on the Unix socket only, and every client connects over TCP
      test: [ "CMD", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER}", "-d", "openaev" ]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: pgsty/silo:latest
    volumes:
      - s3data:/data
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}    
    command: server /data
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=rabbit01@localhost
    ports:
      - "5672:5672"
      - "15672:15672"      
    volumes:
      - type: bind
        source: ./rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf 
      - amqpdata:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  ###########################
  # COMMON                  #
  ###########################

  xtm-composer:
    image: filigran/xtm-composer:latest
    platform: linux/amd64
    environment:
      - MANAGER__ID=${XTM_COMPOSER_ID}
      - MANAGER__NAME=OpenCTI Connector Manager
      - MANAGER__CREDENTIALS_KEY_FILEPATH=/keys/private_key.pem
      - OPENCTI__ENABLE=true
      - OPENCTI__URL=http://opencti:8080
      - OPENCTI__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - OPENCTI__DAEMON__SELECTOR=docker
      - OPENCTI__DAEMON__DOCKER__NETWORK_MODE=${COMPOSE_PROJECT_NAME}_default
      - OPENAEV__ENABLE=true
      - OPENAEV__URL=http://openaev:8080
      - OPENAEV__TOKEN=${OPENAEV_ADMIN_TOKEN}
      - OPENAEV__DAEMON__SELECTOR=docker
      - OPENAEV__DAEMON__DOCKER__NETWORK_MODE=${COMPOSE_PROJECT_NAME}_default
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - rsakeys:/keys:ro  # RSA key mounted as read-only
    depends_on:
      rsa-key-generator:
        condition: service_healthy
      opencti:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  ###########################
  # OPENCTI                 #
  ###########################

  # Front: UI/API for users, connector registration, XTM One / OpenAEV / xtm-composer.
  # Managers off, as in helm-generic-xtm's front (OpenCTI clustering doc). It runs
  # platform init first; the ingest node waits for it.
  opencti:
    image: opencti/platform:latest
    environment:
      <<: *opencti-environment
      RULE_ENGINE__ENABLED: "false"
      HISTORY_MANAGER__ENABLED: "false"
      ACTIVITY_MANAGER__ENABLED: "false"
      CONNECTOR_MANAGER__ENABLED: "false"
      TASK_SCHEDULER__ENABLED: "false"
      EXPIRATION_SCHEDULER__ENABLED: "false"
      NOTIFICATION_MANAGER__ENABLED: "false"
      PIR_MANAGER__ENABLED: "false"
      PLAYBOOK_MANAGER__ENABLED: "false"
      PUBLISHER_MANAGER__ENABLED: "false"
      SYNC_MANAGER__ENABLED: "false"
      INGESTION_MANAGER__ENABLED: "false"
      RETENTION_MANAGER__ENABLED: "false"
      FILE_INDEX_MANAGER__ENABLED: "false"
      INDICATOR_DECAY_MANAGER__ENABLED: "false"
      GARBAGE_COLLECTION_MANAGER__ENABLED: "false"
      HUB_REGISTRATION_MANAGER__ENABLED: "false"
    ports:
      - "${OPENCTI_PORT}:8080"
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always
    healthcheck:
      test:  ["CMD", "wget", "-qO-", "http://opencti:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"]
      interval: 10s
      timeout: 5s
      retries: 20
  # Ingest: only the workers call it; not published. Managers run here.
  opencti-ingest:
    image: opencti/platform:latest
    environment:
      <<: *opencti-environment
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      opencti:
        condition: service_healthy
    restart: always
    healthcheck:
      test:  ["CMD", "wget", "-qO-", "http://opencti-ingest:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"]
      interval: 10s
      timeout: 5s
      retries: 20
  # 3 workers per ingest node
  worker:
    image: opencti/worker:latest
    environment:
      - OPENCTI_URL=http://opencti-ingest:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
    depends_on:
      opencti-ingest:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 3
    restart: always

  ###########################
  # OPENCTI CONNECTORS      #
  ###########################

  connector-export-file-stix:
    image: opencti/connector-export-file-stix:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileStix2
      - CONNECTOR_SCOPE=application/json
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-csv:
    image: opencti/connector-export-file-csv:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_CSV_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileCsv
      - CONNECTOR_SCOPE=text/csv
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-txt:
    image: opencti/connector-export-file-txt:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_TXT_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileTxt
      - CONNECTOR_SCOPE=text/plain
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-file-stix:
    image: opencti/connector-import-file-stix:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportFileStix
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/json,text/xml
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-document:
    image: opencti/connector-import-document:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_DOCUMENT_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportDocument
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
      - CONNECTOR_ONLY_CONTEXTUAL=false # Only extract data related to an entity (a report, a threat actor, etc.)
      - IMPORT_DOCUMENT_CREATE_INDICATOR=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-file-yara:
    image: opencti/connector-import-file-yara:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_YARA_ID} # Valid UUIDv4
      - CONNECTOR_NAME=ImportFileYARA
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=text/yara+plain
      - CONNECTOR_AUTO=false # Enable/disable auto-import of file
      - YARA_IMPORT_FILE_SPLIT_RULES=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-analysis:
    image: opencti/connector-import-document:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_ANALYSIS_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_ANALYSIS
      - CONNECTOR_NAME=ImportDocumentAnalysis
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=false # Validate any bundle before import
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
      - CONNECTOR_ONLY_CONTEXTUAL=false # Only extract data related to an entity (a report, a threat actor, etc.)
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-external-reference:
    image: opencti/connector-import-external-reference:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_EXTERNAL_REFERENCE_ID}
      - CONNECTOR_NAME=ImportExternalReference
    restart: always
    depends_on:
      opencti:
        condition: service_healthy          

  ###########################
  # OPENCTI DEFAULT DATA    #
  ###########################

  connector-opencti:
    image: opencti/connector-opencti:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_OPENCTI_ID}
      - "CONNECTOR_NAME=OpenCTI Datasets"
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=100
    restart: always
    depends_on:
      opencti:
        condition: service_healthy      
  connector-mitre:
    image: opencti/connector-mitre:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID}
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=75      
    restart: always
    depends_on:
      opencti:
        condition: service_healthy    

  ###########################
  # OPENAEV                 #
  ###########################

  openaev:
    image: openaev/platform:latest
    environment:
      - OPENAEV_BASE-URL=${OPENAEV_EXTERNAL_SCHEME}://${OPENAEV_HOST}:${OPENAEV_PORT}
      - OPENAEV_AUTH-LOCAL-ENABLE=true
      - OPENAEV_ADMIN_EMAIL=${OPENAEV_ADMIN_EMAIL}
      - OPENAEV_ADMIN_PASSWORD=${OPENAEV_ADMIN_PASSWORD}
      - OPENAEV_ADMIN_TOKEN=${OPENAEV_ADMIN_TOKEN}
      - OPENAEV_HEALTHCHECK_KEY=${OPENAEV_HEALTHCHECK_KEY:-ChangeMe}
      - OPENAEV_ADMIN_ENCRYPTION_KEY=${OPENAEV_ADMIN_ENCRYPTION_KEY}
      - OPENAEV_ADMIN_ENCRYPTION_SALT=${OPENAEV_ADMIN_ENCRYPTION_SALT}
      - OPENAEV_EXTRA-TRUSTED-CERTS-DIR=/opt/openaev/additional_certs
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgsql:5432/openaev
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS-KEY=${MINIO_ROOT_USER}
      - MINIO_ACCESS-SECRET=${MINIO_ROOT_PASSWORD}
      - OPENAEV_RABBITMQ_HOSTNAME=rabbitmq
      - OPENAEV_RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - OPENAEV_RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      # OpenAEV takes ONE engine URL (no multi-node list): es01 for now; put a load
      # balancer in front of es01-03 for failover
      - ENGINE_URL=http://es01:9200
      - SPRING_ELASTICSEARCH_URIS=http://es01:9200
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - SPRING_MAIL_HOST=${SMTP_HOST}
      - SPRING_MAIL_PORT=${SMTP_PORT}
      - SPRING_MAIL_USERNAME=${SMTP_USERNAME}
      - SPRING_MAIL_PASSWORD=${SMTP_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SMTP_AUTH}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=${SMTP_SSL_ENABLE}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST=*
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SMTP_STARTTLS_ENABLE}
      - OPENAEV_MAIL_IMAP_ENABLED=${OPENAEV_MAIL_IMAP_ENABLED}
      - OPENAEV_MAIL_IMAP_HOST=${IMAP_HOST}
      - OPENAEV_MAIL_IMAP_PORT=${IMAP_PORT}
      - OPENAEV_MAIL_IMAP_USERNAME=${IMAP_USERNAME}
      - OPENAEV_MAIL_IMAP_PASSWORD=${IMAP_PASSWORD}
      - OPENAEV_MAIL_IMAP_AUTH=${IMAP_AUTH}
      - OPENAEV_MAIL_IMAP_SSL_ENABLE=${IMAP_SSL_ENABLE}
      - OPENAEV_MAIL_IMAP_SSL_TRUST=*
      - OPENAEV_MAIL_IMAP_STARTTLS_ENABLE=${IMAP_STARTTLS_ENABLE}
      # OpenCTI
      - OPENAEV_XTM_OPENCTI_ENABLE=true
      - OPENAEV_XTM_OPENCTI_URL=${OPENCTI_EXTERNAL_SCHEME}://${OPENCTI_HOST}:${OPENCTI_PORT}
      # Spring @Value does not relax-bind env vars to hyphenated property
      # names (`openaev.xtm.opencti.api-url`), so we inject it via
      # SPRING_APPLICATION_JSON instead of an env var with a hyphen.
      - SPRING_APPLICATION_JSON={"openaev":{"xtm":{"opencti":{"api-url":"http://opencti:8080/graphql"}}}}
      - OPENAEV_XTM_OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      # XTM One
      - OPENAEV_XTM_ONE_URL=http://xtm-one:4000
      - OPENAEV_XTM_ONE_TOKEN=${PLATFORM_REGISTRATION_TOKEN}
    ports:
      - "8081:8080" # If you change the host port (the left one) do not forget to update OPENAEV_BASE-URL in you .env
    depends_on:
      pgsql:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://openaev:8080/api/health?health_access_key=${OPENAEV_HEALTHCHECK_KEY}" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

