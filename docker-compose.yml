  ###########################
  # XTM ONE                 #
  ###########################

  # Role, database and pgvector extension of XTM One in the shared pgsql instance. The
  # role is not a superuser, and only a superuser can create pgvector (not a trusted
  # extension). Unlike /docker-entrypoint-initdb.d, it also runs on an existing volume.
  xtm-one-db-init:
    image: pgvector/pgvector:pg17
    environment:
      PGHOST: pgsql
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      XTM_ONE_POSTGRES_USER: ${XTM_ONE_POSTGRES_USER}
      XTM_ONE_POSTGRES_PASSWORD: ${XTM_ONE_POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$XTM_ONE_POSTGRES_USER" ] && [ -n "$$XTM_ONE_POSTGRES_PASSWORD" ] || { echo "XTM_ONE_POSTGRES_USER and XTM_ONE_POSTGRES_PASSWORD must be set in .env" >&2; exit 1; }
        [ "$$XTM_ONE_POSTGRES_USER" != "$$PGUSER" ] || { echo "XTM_ONE_POSTGRES_USER must differ from POSTGRES_USER, the superuser of the shared instance" >&2; exit 1; }
        psql -v ON_ERROR_STOP=1 -v role="$$XTM_ONE_POSTGRES_USER" -v pw="$$XTM_ONE_POSTGRES_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec
        SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'pw') \gexec
        SELECT format('CREATE DATABASE xtm_one OWNER %I', :'role') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'xtm_one') \gexec
        \connect xtm_one
        CREATE EXTENSION IF NOT EXISTS vector;
        SQL
    depends_on:
      pgsql:
        condition: service_healthy
    restart: "no"

  # OpenSandbox server: runs the code interpreter and custom tools of XTM One in
  # containers it starts through the container engine's API socket
  # (CONTAINER_ENGINE_SOCKET, e.g. $XDG_RUNTIME_DIR/podman/podman.sock under rootless
  # Podman). Used when XTM_ONE_CUSTOM_TOOL_SANDBOX=opensandbox; idle otherwise.
  # Mirrors the opensandbox service of XTM One's docker-compose.yml.
  opensandbox:
    image: docker.io/opensandbox/server:${OPENSANDBOX_SERVER_IMAGE_TAG:-v0.2.1}
    environment:
      # Same key as the one XTM One sends (OPENSANDBOX_API_KEY). Unset, the server,
      # which drives the container engine, accepts unauthenticated requests.
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:-}
    # Sandboxes publish their ports on the host and are advertised as
    # host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Unlabeled so the server may use the engine socket on an SELinux host (it is then
    # not confined by SELinux there); no effect without SELinux
    security_opt:
      - label=disable
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./opensandbox/sandbox.docker.toml:/etc/opensandbox/config.toml:ro,z
    # Holds the engine socket: on a network of its own with XTM One and its workers
    # only, so no other container of the stack reaches it
    networks:
      - opensandbox
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  xtm-one:
    image: xtmone/platform:latest
    environment:
      <<: *xtm-one-environment
      # Content-Security-Policy on the HTML pages (report-only | enforce | off)
      CONTENT_SECURITY_POLICY_MODE: ${XTM_ONE_CONTENT_SECURITY_POLICY_MODE:-report-only}
      CONTENT_SECURITY_POLICY_FRAME_ANCESTORS: ${XTM_ONE_CONTENT_SECURITY_POLICY_FRAME_ANCESTORS:-}
      WEB_WORKERS: ${XTM_ONE_WEB_WORKERS:-2}
      GRACEFUL_TIMEOUT: ${XTM_ONE_GRACEFUL_TIMEOUT:-120}
      # Proxy peers allowed to set the client address and scheme (behind a TLS proxy)
      FORWARDED_ALLOW_IPS: ${XTM_ONE_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # The URL OpenCTI and OpenAEV reach XTM One on (XTM__XTM_ONE_URL,
      # OPENAEV_XTM_ONE_URL): accepted as the audience of the tokens they send,
      # for versions that address them to that URL instead of the BASE_URL above
      XTM_AUTH_ACCEPTED_AUDIENCES: http://xtm-one:4000
    ports:
      - "${XTM_ONE_PORT}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - opensandbox
    depends_on:
      xtm-one-db-init:
        condition: service_completed_successfully
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    healthcheck:
      # Readiness, not liveness: /api/health answers 200 while migrations and seeding
      # still run; /api/health/ready only once startup has completed
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/api/health/ready')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Background worker (SAQ). Draws whole Video Studio renders and scene previews, and
  # runs every other background job.
  xtm-one-worker: &xtm-one-worker
    image: xtmone/worker:latest
    environment:
      <<: *xtm-one-environment
      WORKER_CONCURRENCY: ${XTM_ONE_WORKER_CONCURRENCY:-20}
      WORKER_JOB_TIMEOUT: ${XTM_ONE_WORKER_JOB_TIMEOUT:-600}
      WORKER_SHUTDOWN_GRACE_PERIOD: 20
      # Its stop_grace_period, below
      WORKER_TERMINATION_GRACE_SECONDS: 1260
    # Above the SAQ shutdown grace, and long enough for the renders a stopping worker
    # lets finish (VIDEO_STUDIO_RENDER_DRAIN_SECONDS, 20 min)
    stop_grace_period: 1260s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - opensandbox
    depends_on:
      xtm-one:
        condition: service_healthy
    restart: always
    healthcheck:
      # Orchestration reconciler heartbeat (the worker has no HTTP server)
      test: ["CMD", "python", "-m", "app.healthcheck", "reconciler"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # The same worker, drawing Video Studio scene previews and no whole render, so a 4K
  # render never leaves the previews short of memory. They run every other job too.
  xtm-one-worker-preview:
    <<: *xtm-one-worker
    deploy:
      mode: replicated
      replicas: 2
    environment:
      <<: *xtm-one-environment
      WORKER_CONCURRENCY: ${XTM_ONE_WORKER_CONCURRENCY:-20}
      WORKER_JOB_TIMEOUT: ${XTM_ONE_WORKER_JOB_TIMEOUT:-600}
      WORKER_SHUTDOWN_GRACE_PERIOD: 20
      WORKER_TERMINATION_GRACE_SECONDS: 1260
      VIDEO_STUDIO_RENDER_CONCURRENCY: "0"

networks:
  opensandbox:

volumes:
  esdata01:
  esdata02:
  esdata03:
  pgsqlshareddata:
  s3data:
  redisdata-primary:
  redisdata-replica-1:
  redisdata-replica-2:
  redis-sentinel-1:
  redis-sentinel-2:
  redis-sentinel-3:
  amqpdata:
  rsakeys:
