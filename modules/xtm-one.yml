services:

  ###########################
  # XTM ONE                 #
  ###########################

  # Role, database and pgvector extension of XTM One in the shared pgsql instance. The
  # role is not a superuser, and only a superuser can create pgvector (not a trusted
  # extension). Unlike /docker-entrypoint-initdb.d, it also runs on an existing volume.
  xtm-one-db-init:
    image: pgvector/pgvector:pg17
    environment:
      PGHOST: pgsql
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      XTM_ONE_POSTGRES_USER: ${XTM_ONE_POSTGRES_USER}
      XTM_ONE_POSTGRES_PASSWORD: ${XTM_ONE_POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$XTM_ONE_POSTGRES_USER" ] && [ -n "$$XTM_ONE_POSTGRES_PASSWORD" ] || { echo "XTM_ONE_POSTGRES_USER and XTM_ONE_POSTGRES_PASSWORD must be set in .env" >&2; exit 1; }
        [ "$$XTM_ONE_POSTGRES_USER" != "$$PGUSER" ] || { echo "XTM_ONE_POSTGRES_USER must differ from POSTGRES_USER, the superuser of the shared instance" >&2; exit 1; }
        psql -v ON_ERROR_STOP=1 -v role="$$XTM_ONE_POSTGRES_USER" -v pw="$$XTM_ONE_POSTGRES_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec
        SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'pw') \gexec
        SELECT format('CREATE DATABASE xtm_one OWNER %I', :'role') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'xtm_one') \gexec
        \connect xtm_one
        CREATE EXTENSION IF NOT EXISTS vector;
        SQL
    depends_on:
      pgsql:
        condition: service_healthy
    restart: "no"

  xtm-one:
    # Published for linux/amd64 only: runs through emulation on ARM (Rosetta on Docker Desktop)
    platform: linux/amd64
    image: xtmone/platform:latest
    environment:
      - PLATFORM_MODE=xtm_one
      - PLATFORM_REGISTRATION_TOKEN=${PLATFORM_REGISTRATION_TOKEN}
      - BASE_URL=${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
      - FRONTEND_URL=${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
      - ADMIN_EMAIL=${XTM_ONE_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${XTM_ONE_ADMIN_PASSWORD}
      - SECRET_KEY=${XTM_ONE_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${XTM_ONE_POSTGRES_USER}:${XTM_ONE_POSTGRES_PASSWORD}@pgsql:5432/xtm_one
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${XTM_ONE_S3_BUCKET:-xtm-one-files}
      - S3_USE_SSL=false
      - LOG_LEVEL=${XTM_ONE_LOG_LEVEL:-info}
      - LOG_FORMAT=${XTM_ONE_LOG_FORMAT:-json}
      - ENTERPRISE_LICENSE=${XTM_ONE_ENTERPRISE_LICENSE:-}
      # Internal API endpoints for platform integrations (Docker hostnames)
      - OPENCTI_API_URL=http://opencti:8080
      - OPENAEV_API_URL=http://openaev:8080
      # The URL OpenCTI and OpenAEV reach XTM One on (XTM__XTM_ONE_URL,
      # OPENAEV_XTM_ONE_URL): accepted as the audience of the tokens they send,
      # for versions that address them to that URL instead of the BASE_URL above
      - XTM_AUTH_ACCEPTED_AUDIENCES=http://xtm-one:4000
    ports:
      - "${XTM_ONE_PORT}:4000"
    depends_on:
      xtm-one-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  xtm-one-worker:
    # Published for linux/amd64 only: runs through emulation on ARM (Rosetta on Docker Desktop)
    platform: linux/amd64
    image: xtmone/worker:latest
    environment:
      - PLATFORM_MODE=xtm_one
      - PLATFORM_REGISTRATION_TOKEN=${PLATFORM_REGISTRATION_TOKEN}
      # Same public URL as the xtm-one service: the worker signs the tokens of
      # background work (assignments, delegated tasks, autonomous runs)
      - BASE_URL=${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
      - FRONTEND_URL=${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
      - ADMIN_EMAIL=${XTM_ONE_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${XTM_ONE_ADMIN_PASSWORD}
      - SECRET_KEY=${XTM_ONE_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${XTM_ONE_POSTGRES_USER}:${XTM_ONE_POSTGRES_PASSWORD}@pgsql:5432/xtm_one
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${XTM_ONE_S3_BUCKET:-xtm-one-files}
      - S3_USE_SSL=false
      - LOG_LEVEL=${XTM_ONE_LOG_LEVEL:-info}
      - LOG_FORMAT=${XTM_ONE_LOG_FORMAT:-json}
      - ENTERPRISE_LICENSE=${XTM_ONE_ENTERPRISE_LICENSE:-}
    depends_on:
      xtm-one:
        condition: service_healthy
    restart: always
