# Rootless Podman override (validated on Rocky Linux 9.8, Podman 5.8.2). Use with:
#   docker-compose -f docker-compose.yml -f docker-compose.podman.yml up -d
# memlock -1 exceeds the rootless user's hard limit (8192 KB) and the container would
# fail to start; Elasticsearch runs without it (bootstrap.memory_lock is not set).
services:
  es01:
    ulimits: !override
      nofile: {soft: 65536, hard: 65536}
  es02:
    ulimits: !override
      nofile: {soft: 65536, hard: 65536}
  es03:
    ulimits: !override
      nofile: {soft: 65536, hard: 65536}

  # The OpenSandbox server only resolves host.docker.internal (its [docker].host_ip) for
  # the egress-sidecar readiness probe when it sees /.dockerenv; Podman creates
  # /run/.containerenv instead, so without this marker the server probes its own
  # 127.0.0.1 and every sandbox fails with "Egress sidecar did not become ready".
  opensandbox:
    volumes:
      - ./opensandbox/dockerenv:/.dockerenv:ro,z
